app_id: 2394010
slug: "palworld"
name: "Palworld"
run_command: './PalServer.sh -port={PORT} -savedir {SAVE_DIR}'
executable: "PalServer.sh"
stop_command: "quit"
port: 8211
port_name: "game"
launch_options:
  - key: max_players
    label: Maximum players
    description: Number of players allowed at once (Palworld supports up to 32).
    type: number
    flag: -players
    flag_separator: "="
    default: "32"
    min: 1
    max: 32
  - key: public_lobby
    label: Public lobby
    description: Enable Palworld's public lobby listing.
    type: boolean
    flag: -publiclobby
    default: "true"
config_files:
  - "DefaultPalWorldSettings.ini"
save_dirs:
  - "Pal/Saved/SaveGames"
# Palworld is a Steam query (A2S) game on UDP, query port = game port + 1.
expose:
  # no explicit port: follows the server's configured game port (remappable)
  - proto: udp
  - offset: 1
    proto: udp
    optional: true
backup_dirs:
  - "Pal/Saved/SaveGames"
  - "Pal/Saved/SavedConfig"
  - "DefaultPalWorldSettings.ini"