app_id: 380870
slug: "project-zomboid"
name: "Project Zomboid"
# Linux depot ships start-server64.sh (StartServer64.bat is the Windows file)
run_command: './start-server64.sh'
executable: "start-server64.sh"
stop_command: "quit"
port: 16261
port_name: "game"
launch_options:
  - key: profile_name
    label: Server profile name
    description: Selects the Project Zomboid server profile/configuration; defaults to server.
    type: text
    flag: -servername
    default: server
    min_length: 1
    max_length: 64
notes: "Game port is UDP. One extra UDP port per client slot opens above the game port (16262+). Edit Server/servertest.ini to change ports — the published ports must match it."
config_files:
  - "Server/servertest.ini"
expose:
  - port: 16261
    proto: udp
  - port: 16262
    proto: udp
    optional: true
  - port: 16263
    proto: udp
    optional: true
  - port: 16264
    proto: udp
    optional: true
save_dirs:
  - "Saves"
  - "Server"
backup_dirs:
  - "Saves"
  - "Server"
  - "Server/servertest.ini"
