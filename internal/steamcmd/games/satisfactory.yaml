app_id: 1690800
slug: "satisfactory"
name: "Satisfactory"
run_command: './FactoryServer.sh -Port={PORT} -unattended -log -savedir {SAVE_DIR}'
executable: "FactoryServer.sh"
stop_command: "quit"
port: 7777
port_name: "game"
# Satisfactory: game + Steam query on 7777 (UDP; TCP kept for legacy client
# paths), API/beacon on 15000/tcp. Configurable via -Port and the ini files.
expose:
  # no explicit port: follows the server's configured game port (remappable)
  - proto: udp
  - proto: tcp
    optional: true
  - port: 15000
    proto: tcp
    optional: true
save_dirs:
  - "saves"
  - "FactoryGame/Saved/SaveGames"
  - "FactoryGame/Saved/Config"
backup_dirs:
  - "saves"
  - "FactoryGame/Saved/SaveGames"
  - "FactoryGame/Saved/Config"
  - "GameUserSettings.ini"