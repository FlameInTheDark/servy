name: Release

# semantic-release turns conventional commits on main into a versioned GitHub
# release, and the jobs below build and attach what that release ships:
# cross-compiled archives + SHA256SUMS, and the container images.
#
# Everything lives in this one workflow on purpose. A release created with the
# default GITHUB_TOKEN does not start other workflows (`release: published`
# never fires — GitHub suppresses events caused by GITHUB_TOKEN, except
# workflow_dispatch/repository_dispatch), so a separate workflow waiting for
# that event would silently never run and the release would ship without
# assets.
on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: semantic-release
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}
      major: ${{ steps.semantic.outputs.new_release_major_version }}
      minor: ${{ steps.semantic.outputs.new_release_minor_version }}
      tag: ${{ steps.tag.outputs.tag }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run semantic-release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 24
          extra_plugins: |
            @semantic-release/changelog@6
            @semantic-release/git@10
            @semantic-release/exec@6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # semantic-release reports the tag it created; the version-based fallback
      # covers the (theoretical) case where the output comes back empty.
      - name: Resolve the published tag
        id: tag
        if: steps.semantic.outputs.new_release_published == 'true'
        env:
          RELEASE_TAG: ${{ steps.semantic.outputs.new_release_git_tag }}
          RELEASE_VERSION: ${{ steps.semantic.outputs.new_release_version }}
          RELEASE_CHANNEL: ${{ steps.semantic.outputs.new_release_channel }}
        run: |
          TAG="${RELEASE_TAG}"
          if [ -z "${TAG}" ] || [ "${TAG}" = "undefined" ]; then
            TAG="v${RELEASE_VERSION}"   # .releaserc.json sets tagFormat=v${version}
          fi
          PRERELEASE=false
          if [ -n "${RELEASE_CHANNEL}" ] && [ "${RELEASE_CHANNEL}" != "undefined" ]; then
            PRERELEASE=true             # released on the beta channel
          fi
          case "${RELEASE_VERSION}" in
            *-*) PRERELEASE=true ;;     # 1.2.0-beta.1 and friends
          esac
          {
            echo "tag=${TAG}"
            echo "prerelease=${PRERELEASE}"
          } >> "$GITHUB_OUTPUT"
          echo "Published ${TAG} (prerelease=${PRERELEASE})"

  binaries:
    name: ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.release.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64, archive: tar.gz }
          - { goos: linux, goarch: arm64, archive: tar.gz }
          - { goos: darwin, goarch: amd64, archive: tar.gz }
          - { goos: darwin, goarch: arm64, archive: tar.gz }
          - { goos: windows, goarch: amd64, archive: zip }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the frontend (embedded into the binary)
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..
          rm -rf internal/spa/dist
          cp -r frontend/dist internal/spa/dist

      - name: Cross-compile
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          COMMIT="$(git rev-parse --short HEAD)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-s -w \
          -X github.com/FlameInTheDark/servy/internal/version.Version=${VERSION} \
          -X github.com/FlameInTheDark/servy/internal/version.Commit=${COMMIT} \
          -X github.com/FlameInTheDark/servy/internal/version.BuildDate=${DATE}"
          go build -trimpath -ldflags "${LDFLAGS}" -o dist/servy ./cmd/servy

      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        run: |
          NAME="servy_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}"
          mkdir -p "dist/${NAME}"
          cp dist/servy "dist/${NAME}/"
          cp README.md LICENSE CHANGELOG.md "dist/${NAME}/" 2>/dev/null || true
          tar -czf "dist/${NAME}.tar.gz" -C dist "${NAME}"
          echo "ASSET=dist/${NAME}.tar.gz" >> "$GITHUB_ENV"

      - name: Package (windows)
        if: matrix.archive == 'zip'
        run: |
          NAME="servy_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}"
          mkdir -p "dist/${NAME}"
          mv dist/servy "dist/${NAME}/servy.exe"
          cp README.md LICENSE CHANGELOG.md "dist/${NAME}/" 2>/dev/null || true
          (cd dist && zip -r "${NAME}.zip" "${NAME}")
          echo "ASSET=dist/${NAME}.zip" >> "$GITHUB_ENV"

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: asset-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/servy_*.tar.gz
            dist/servy_*.zip
          retention-days: 5

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release.outputs.tag }}" "${ASSET}" --clobber

  checksums:
    name: SHA256SUMS
    needs: [release, binaries]
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download all archives
        uses: actions/download-artifact@v4
        with:
          pattern: asset-*
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: dist
        run: sha256sum servy_*.tar.gz servy_*.zip > SHA256SUMS

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release.outputs.tag }}" dist/SHA256SUMS --clobber

  docker:
    name: Container image → ghcr.io
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/servy
          # raw tags: the workflow runs on the main branch, so the vX.Y.Z ref
          # that `type=semver` reads does not exist here — the version comes
          # from semantic-release instead.
          tags: |
            type=raw,value=${{ needs.release.outputs.version }}
            type=raw,value=${{ needs.release.outputs.major }}.${{ needs.release.outputs.minor }},enable=${{ needs.release.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.release.outputs.prerelease == 'false' }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.release.outputs.version }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-wine:
    name: servy-wine image → ghcr.io
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/servy-wine
          tags: |
            type=raw,value=${{ needs.release.outputs.version }}
            type=raw,value=${{ needs.release.outputs.major }}.${{ needs.release.outputs.minor }},enable=${{ needs.release.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.release.outputs.prerelease == 'false' }}

      # Windows game servers via Wine need amd64 + i386 — no arm64 build.
      # The image is the self-made Wine + SteamCMD base referenced by the
      # windows-only games in the catalog (docker_image default).
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: docker/steamcmd-wine
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
