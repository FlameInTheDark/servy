# Development images: rebuilt on every push to the default branch that touches
# the Dockerfiles, the frontend or the Go modules, and on manual dispatch.
#
# Published references:
#   ghcr.io/flameinthedark/servy:latest        (main panel image)
#   ghcr.io/flameinthedark/servy-wine:latest   (Windows game server base)
#
# Versioned images (`x.y.z`, `x.y`, `latest`) for a release are built and
# pushed by the Release workflow itself — a tag pushed with the default
# GITHUB_TOKEN does not start other workflows, so it cannot live here.
name: docker-images

on:
  push:
    branches: [master, main]
    paths:
      - "Dockerfile"
      - "docker/steamcmd-wine/**"
      - ".github/workflows/docker-images.yml"
      - "go.mod"
      - "go.sum"
      - "frontend/**"
      - "internal/spa/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  servy:
    name: servy panel image → ghcr.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/servy
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  servy-wine:
    name: servy-wine image → ghcr.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/servy-wine
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Windows game servers via Wine need amd64 + i386 — no arm64 build.
      # The image is the self-made Wine + SteamCMD base referenced by the
      # windows-only games in the catalog (docker_image default).
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: docker/steamcmd-wine
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max