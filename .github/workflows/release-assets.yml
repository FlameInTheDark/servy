name: Release assets

# Fires when semantic-release publishes a release (Release workflow).
# 1. Builds the frontend + cross-compiles servy / servy-agent for every
#    supported platform and attaches the archives + SHA256SUMS to the release.
# 2. Builds the runtime container image (all Minecraft Java generations,
#    SteamCMD, docker CLI) and pushes it to the GitHub Container Registry.
on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    name: ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64, archive: tar.gz }
          - { goos: linux, goarch: arm64, archive: tar.gz }
          - { goos: darwin, goarch: amd64, archive: tar.gz }
          - { goos: darwin, goarch: arm64, archive: tar.gz }
          - { goos: windows, goarch: amd64, archive: zip }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend (embedded into the binary)
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..
          rm -rf internal/spa/dist
          cp -r frontend/dist internal/spa/dist

      - name: Cross-compile
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          VER="${GITHUB_REF_NAME#v}"
          COMMIT="${GITHUB_SHA::7}"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-s -w -X github.com/FlameInTheDark/servy/internal/version.Version=${VER} -X github.com/FlameInTheDark/servy/internal/version.Commit=${COMMIT} -X github.com/FlameInTheDark/servy/internal/version.BuildDate=${DATE}"
          go build -trimpath -ldflags "${LDFLAGS}" -o "dist/servy" ./cmd/servy
          go build -trimpath -ldflags "${LDFLAGS}" -o "dist/servy-agent" ./cmd/servy-agent
          echo "VERSION=${VER}" >> "$GITHUB_ENV"

      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        run: |
          NAME="servy_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}"
          mkdir -p "dist/${NAME}"
          cp dist/servy dist/servy-agent "dist/${NAME}/"
          cp README.md LICENSE CHANGELOG.md "dist/${NAME}/" 2>/dev/null || true
          tar -czf "dist/${NAME}.tar.gz" -C dist "${NAME}"
          echo "ASSET=dist/${NAME}.tar.gz" >> "$GITHUB_ENV"

      - name: Package (windows)
        if: matrix.archive == 'zip'
        run: |
          NAME="servy_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}"
          mkdir -p "dist/${NAME}"
          mv dist/servy "dist/${NAME}/servy.exe"
          mv dist/servy-agent "dist/${NAME}/servy-agent.exe"
          cp README.md LICENSE CHANGELOG.md "dist/${NAME}/" 2>/dev/null || true
          (cd dist && zip -r "${NAME}.zip" "${NAME}")
          echo "ASSET=dist/${NAME}.zip" >> "$GITHUB_ENV"

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: asset-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/servy_*.tar.gz
            dist/servy_*.zip
          retention-days: 5

      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" "${ASSET}" --clobber

  checksums:
    name: SHA256SUMS
    runs-on: ubuntu-latest
    needs: binaries
    steps:
      - name: Download all archives
        uses: actions/download-artifact@v4
        with:
          pattern: asset-*
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: dist
        run: sha256sum servy_*.tar.gz servy_*.zip > SHA256SUMS

      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/SHA256SUMS --clobber

  docker:
    name: Container image → ghcr.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/servy
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.event.release.tag_name }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-wine:
    name: servy-wine image → ghcr.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/servy-wine
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}

      # Windows game servers via Wine need amd64 + i386 — no arm64 build.
      # The image is the self-made Wine + SteamCMD base referenced by the
      # windows-only games in the catalog (docker_image default).
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: docker/steamcmd-wine
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
