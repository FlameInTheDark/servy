syntax = "proto3";

package servy.node.v1;

option go_package = "github.com/FlameInTheDark/servy/internal/cluster/pb;pb";

// NodeService is served by every node in a cluster (panel + agents).
//
// Connection model: agents dial the panel's node API (join → hello → heartbeat)
// and the panel dials each agent's node API to run server operations. Nothing
// in the panel↔agent direction is initiated from the agent except registration,
// telemetry and the event stream.
service NodeService {
  // Membership. Join exchanges a single-use join ticket (issued by the panel
  // UI/API) for a permanent per-node credential; it is the only unauthenticated
  // call.
  rpc Join(JoinRequest) returns (JoinResponse);
  rpc Hello(HelloRequest) returns (HelloResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);

  // Server lifecycle proxying
  rpc CreateServer(CreateServerRequest) returns (ServerActionResponse);
  rpc DeleteServer(DeleteServerRequest) returns (ServerActionResponse);
  rpc StartServer(ServerRequest) returns (ServerActionResponse);
  rpc StopServer(ServerRequest) returns (ServerActionResponse);
  rpc RestartServer(ServerRequest) returns (ServerActionResponse);
  rpc KillServer(ServerRequest) returns (ServerActionResponse);
  rpc ServerStatus(ServerRequest) returns (ServerStatusResponse);
  rpc ListServers(ListServersRequest) returns (ListServersResponse);
  rpc SendStdin(StdinRequest) returns (Ack);
  rpc ReadTerminal(TerminalRequest) returns (TerminalChunk);
  rpc UpdateServerConfig(NodeRequest) returns (NodeReply);
  rpc ServerHistory(HistoryRequest) returns (NodeReply);
  rpc AgreeEula(ServerRequest) returns (NodeReply);
  rpc UpdateExecutable(ServerRequest) returns (NodeReply);
  rpc CloneServer(CloneServerRequest) returns (NodeReply);

  // Events stream (agent -> panel), long lived.
  rpc StreamEvents(stream NodeEvent) returns (Ack);

  // Files. ReadFile/WriteFile are streaming so large worlds and uploads work;
  // FileOp covers the remaining file-manager actions.
  rpc ListFiles(FileRequest) returns (DirListing);
  rpc ReadFile(FileStreamRequest) returns (stream FileChunk);
  rpc WriteFile(stream FileChunk) returns (Ack);
  rpc FileOp(FileOpRequest) returns (NodeReply);

  // Backups (archives live on the node, metadata lives on the panel).
  rpc BackupRun(BackupRunRequest) returns (NodeReply);
  rpc BackupRestore(BackupRef) returns (NodeReply);
  rpc BackupDelete(BackupRef) returns (NodeReply);
  rpc BackupFiles(BackupRef) returns (NodeReply);
  rpc BackupRead(BackupReadRequest) returns (stream FileChunk);

  // Wizard archive transfer (zip/jar imports created on a remote node).
  rpc UploadArchive(stream ArchiveChunk) returns (NodeReply);
}

message JoinRequest {
  string ticket = 1;      // single-use join ticket issued by the panel
  string name = 2;        // node display name (defaults to the hostname)
  string version = 3;
  string hostname = 4;
  int32 grpc_port = 5;    // local node API port
  string advertise = 6;   // optional explicit host:port the panel should dial
  repeated string capabilities = 7;
}

message JoinResponse {
  bool accepted = 1;
  string message = 2;
  string node_id = 3;
  string token = 4;       // permanent per-node credential (store securely)
  string panel_grpc = 5;  // panel node API address agents should use
}

message HelloRequest {
  string node_id = 1;
  string name = 2;
  string version = 3;
  repeated string capabilities = 4;
  string role = 5; // "panel" | "agent"
}

message HelloResponse {
  bool accepted = 1;
  string panel_version = 2;
  string message = 3;
}

message HeartbeatRequest {
  string node_id = 1;
  double cpu_usage = 2;
  double mem_percent = 3;
  int64 mem_total = 4;
  int64 mem_used = 5;
  int64 disk_total = 6;
  int64 disk_used = 7;
  int32 running_servers = 8;
  string version = 9;
  int32 total_servers = 10;
}

message HeartbeatResponse {
  bool ok = 1;
  string message = 2;
}

message CreateServerRequest {
  string server_id = 1;
  string definition = 2; // JSON creation.Request — the node runs the full pipeline
}

message DeleteServerRequest {
  string server_id = 1;
  bool remove_files = 2;
}

message ServerRequest {
  string server_id = 1;
  string user = 2;
}

message ServerActionResponse {
  bool ok = 1;
  string message = 2;
  string payload = 3; // JSON (server id / definition) where the caller needs it
}

message ServerStatusResponse {
  string server_id = 1;
  string state = 2; // stopped|starting|running|stopping|crashed|updating|importing
  double cpu = 3;
  int64 mem = 4;
  int32 online = 5;
  int32 max = 6;
  repeated string players = 7;
  string version = 8;
  string desc = 9;
  int64 world_size = 10;
  bool eula_pending = 11;
  double ping_ms = 12;
}

message ListServersRequest {}

message ListServersResponse {
  repeated ServerStatusResponse servers = 1;
}

message StdinRequest {
  string server_id = 1;
  string command = 2;
}

message TerminalRequest {
  string server_id = 1;
  int32 lines = 2;
}

message TerminalChunk {
  repeated string lines = 1;
}

message HistoryRequest {
  string server_id = 1;
  int32 hours = 2;
}

message NodeRequest {
  string server_id = 1;
  string payload = 2; // JSON
}

message NodeReply {
  bool ok = 1;
  string message = 2;
  string payload = 3; // JSON
}

message CloneServerRequest {
  string server_id = 1;
  string new_server_id = 2;
  string name = 3;
}

message NodeEvent {
  string node_id = 1;
  string server_id = 2;
  string type = 3;    // event name, mirrors REST/WS event catalogue
  string payload = 4; // JSON
  int64 timestamp = 5;
}

message Ack {
  bool ok = 1;
  string message = 2;
}

message FileRequest {
  string server_id = 1;
  string path = 2;
}

message FileStreamRequest {
  string server_id = 1;
  string path = 2;
  int64 max_bytes = 3;
}

message FileChunk {
  string server_id = 1;
  string path = 2;
  bytes content = 3;
  int64 offset = 4;
  bool eof = 5;
  string error = 6;
}

message FileOpRequest {
  string server_id = 1;
  string op = 2;   // mkdir | create | delete | move | copy | zip | unzip | stat
  string path = 3;
  string dst = 4;
  repeated string paths = 5;
  string payload = 6; // JSON extras
}

message DirEntry {
  string name = 1;
  int64 size = 2;
  bool dir = 3;
  string modified = 4;
}

message DirListing {
  repeated DirEntry entries = 1;
}

message BackupRunRequest {
  string server_id = 1;
  string backup_id = 2;
  string payload = 3; // JSON gen.Backup row (metadata the node needs to run)
}

message BackupRef {
  string server_id = 1;
  string backup_id = 2;
  string archive = 3; // archive file name inside the backup
  bool remove_files = 4;
}

message BackupReadRequest {
  string server_id = 1;
  string backup_id = 2;
  string path = 3; // archive path relative to the backup dir
  int64 max_bytes = 4;
}

message ArchiveChunk {
  string transfer_id = 1;
  bytes content = 2;
  string name = 3; // original file name (first chunk only)
  bool eof = 4;
}
