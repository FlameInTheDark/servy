syntax = "proto3";

package servy.node.v1;

option go_package = "github.com/FlameInTheDark/servy/internal/cluster/pb;pb";

// NodeService is served by every node in a cluster (panel + agents).
// Panel nodes proxy user operations to agents; agents push heartbeats & events upstream.
service NodeService {
  // Membership
  rpc Hello(HelloRequest) returns (HelloResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);

  // Server lifecycle proxying
  rpc CreateServer(CreateServerRequest) returns (ServerActionResponse);
  rpc DeleteServer(DeleteServerRequest) returns (ServerActionResponse);
  rpc StartServer(ServerRequest) returns (ServerActionResponse);
  rpc StopServer(ServerRequest) returns (ServerActionResponse);
  rpc RestartServer(ServerRequest) returns (ServerActionResponse);
  rpc KillServer(ServerRequest) returns (ServerActionResponse);
  rpc ServerStatus(ServerRequest) returns (ServerStatusResponse);
  rpc ListServers(ListServersRequest) returns (ListServersResponse);
  rpc SendStdin(StdinRequest) returns (Ack);
  rpc ReadTerminal(TerminalRequest) returns (TerminalChunk);

  // Events stream (agent -> panel)
  rpc StreamEvents(stream NodeEvent) returns (Ack);

  // Files (basic remote ops for v1)
  rpc FileRead(FileRequest) returns (FileContent);
  rpc FileWrite(FileWriteRequest) returns (Ack);
  rpc FileList(FileRequest) returns (DirListing);
}

message HelloRequest {
  string node_id = 1;
  string name = 2;
  string version = 3;
  repeated string capabilities = 4;
  string role = 5; // "panel" | "agent"
}

message HelloResponse {
  bool accepted = 1;
  string panel_version = 2;
  string message = 3;
}

message HeartbeatRequest {
  string node_id = 1;
  double cpu_usage = 2;
  double mem_percent = 3;
  int64 mem_total = 4;
  int64 mem_used = 5;
  int64 disk_total = 6;
  int64 disk_used = 7;
  int32 running_servers = 8;
  string version = 9;
}

message HeartbeatResponse {
  bool ok = 1;
  string message = 2;
}

message CreateServerRequest {
  string server_id = 1;
  string definition = 2; // JSON gen.Server row
}

message DeleteServerRequest {
  string server_id = 1;
  bool remove_files = 2;
}

message ServerRequest {
  string server_id = 1;
  string user = 2;
}

message ServerActionResponse {
  bool ok = 1;
  string message = 2;
}

message ServerStatusResponse {
  string server_id = 1;
  string state = 2; // stopped|starting|running|stopping|crashed|updating|importing
  double cpu = 3;
  int64 mem = 4;
  int32 online = 5;
  int32 max = 6;
  repeated string players = 7;
  string version = 8;
}

message ListServersRequest {}

message ListServersResponse {
  repeated ServerStatusResponse servers = 1;
}

message StdinRequest {
  string server_id = 1;
  string command = 2;
}

message TerminalRequest {
  string server_id = 1;
  int32 lines = 2;
}

message TerminalChunk {
  repeated string lines = 1;
}

message NodeEvent {
  string node_id = 1;
  string server_id = 2;
  string type = 3;    // event name, mirrors REST/WS event catalogue
  string payload = 4; // JSON
  int64 timestamp = 5;
}

message Ack {
  bool ok = 1;
  string message = 2;
}

message FileRequest {
  string server_id = 1;
  string path = 2;
}

message FileContent {
  bytes content = 1;
}

message FileWriteRequest {
  string server_id = 1;
  string path = 2;
  bytes content = 3;
}

message DirEntry {
  string name = 1;
  int64 size = 2;
  bool dir = 3;
  string modified = 4;
}

message DirListing {
  repeated DirEntry entries = 1;
}
